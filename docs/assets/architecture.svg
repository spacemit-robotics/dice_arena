    <text x="821" y="361.6" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">SpacemiT EP 推理</text>
    <text x="821" y="378.1" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">稳定观测 · RTSP 推流</text>

    <!-- manipulation 组件 -->
    <rect class="box" x="400" y="492" width="164" height="88" rx="8" fill="#fdf7ec" stroke="#b7791f" stroke-width="1.4"/>
    <text x="482" y="515" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">manipulation</text>
