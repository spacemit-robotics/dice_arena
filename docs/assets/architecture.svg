<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="684" viewBox="0 0 960 684" role="img" aria-labelledby="title desc">
  <title id="title">Dice Arena 系统架构</title>
  <desc id="desc">浏览器经 HTTP 访问 dice-arena serve 启动的游戏后端；后端运行游戏状态机，按槽位调用机械臂、语音和骰子识别组件。机械臂组件调用抓杯应用 CupApplication，后者由抓杯规划生成动作、由任务策略库检查阶段顺序并锁定失败，经 manipulation 的 DeviceClient、manipulation-device 和 agx_nero_revo2 驱动控制 Nero 机械臂与 Revo2 灵巧手。语音组件调用本机 MOSS-TTS 服务；骰子识别组件启动 yolov8_camera，视频经 MediaMTX 以 WebRTC 送到浏览器。手眼标定把结果写入现场目录，生成 green_cup.json；抓杯应用读取现场配置，并把待人工处理的任务状态记录到 runtime/task_state.json。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="684" fill="#ffffff"/>
  <g font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="480" y="30" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Dice Arena 系统架构</text>

    <!-- 浏览器与视频转发 -->
    <rect class="box" x="264" y="48" width="416" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="472" y="71.5" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">浏览器</text>
    <text x="472" y="89.8" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">游戏网页 :8080 · 实时视频 :8889</text>
    <rect class="box" x="736" y="48" width="170" height="56" rx="8" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.4"/>
    <text x="821" y="71.5" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">MediaMTX</text>
    <text x="821" y="89.8" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">RTSP 转 WebRTC</text>

    <!-- 游戏后端 -->
    <rect class="box" x="224" y="132" width="682" height="72" rx="8" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.4"/>
    <text x="565" y="155.3" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">游戏后端 game/backend</text>
    <text x="565" y="173.6" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">dice-arena serve 启动 · 网页与 HTTP 接口 · 按槽位调用组件</text>
    <text x="565" y="190.1" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">游戏状态机：规则讲解 → 抓杯 → 摇杯 → 放杯 → 视觉判定 → 结果手势 → 返回 HOME</text>

    <!-- 组件 -->
    <rect class="box" x="224" y="232" width="340" height="56" rx="8" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.4"/>
    <text x="394" y="255.5" font-size="14" font-weight="600" fill="#1f2937" text-anchor="middle">机械臂组件 robot_arm_spacemit</text>
    <text x="394" y="273.8" font-size="12" font-weight="400" fill="#4b5563" text-anchor="middle">抓杯 · 摇杯 · 放杯 · 结果手势 · 返回 HOME</text>
    <rect class="box" x="580" y="232" width="140" height="56" rx="8" fill="#ffffff" stroke="#3b6fb6" stroke-width="1.4"/>
